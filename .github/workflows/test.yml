name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: Sync regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check shell syntax
        run: bash -n run.sh test/sync_test.sh
      - name: Run sync regression tests
        run: bash test/sync_test.sh
